<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Tabela de valores · Rafael Guerra Prótese Dentária</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--verde:#376F47;--verde-claro:#62C478;--creme:#F4F4EC;--texto:#2c3530;--suave:#6b736e;--linha:#e4e6e0;--fundo:#ffffff}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:"Montserrat",system-ui,sans-serif;color:var(--texto);background:var(--fundo);line-height:1.5}
.folha{max-width:880px;margin:0 auto;padding:28px 20px 40px}
.topo{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.topo img{height:64px}
.tipo{font-size:22px;font-weight:600;letter-spacing:.24em;color:var(--verde);text-align:right}
.tipo small{display:block;font-size:12px;letter-spacing:0;font-weight:500;color:var(--suave)}
.faixa{display:flex;height:4px;margin:18px 0 22px;overflow:hidden;border-radius:2px}
.faixa i{flex:0 0 72%;background:var(--verde);transform-origin:left;animation:barra 1s ease-out both}
.faixa b{flex:1;background:var(--verde-claro);transform-origin:left;animation:barra 1s .4s ease-out both}
h1{margin:0 0 4px;font-size:clamp(18px,3.4vw,24px);font-weight:700}
.intro{margin:0;color:var(--suave);font-size:14px}
.aviso{margin:18px 0 6px;padding:13px 16px;border:2px solid var(--verde);border-radius:12px;text-align:center;font-weight:700;color:var(--verde);letter-spacing:.03em;font-size:clamp(13px,2.6vw,16px);position:relative;overflow:hidden}
.aviso::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(98,196,120,.18),transparent);transform:translateX(-100%);animation:brilho 2.4s 1.2s ease-in-out 2}
h2{margin:28px 0 10px;font-size:15px;font-weight:700;color:var(--verde)}
.req{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.req div{background:var(--creme);border-radius:12px;padding:14px 16px;font-size:13.5px}
.req b{display:block;margin-bottom:4px;color:var(--verde);font-size:14.5px}
.passos{display:flex;align-items:stretch;gap:0;position:relative}
.passo{flex:1;text-align:center;padding:14px 8px;background:var(--creme);border-radius:12px;margin:0 6px}
.passo b{display:flex;align-items:center;justify-content:center;width:30px;height:30px;margin:0 auto 6px;border-radius:50%;background:var(--verde);color:#fff;font-size:14px}
.passo span{font-size:13.5px;font-weight:600}
.toggle{display:inline-flex;margin:4px 0 14px;padding:4px;background:var(--creme);border-radius:999px;position:relative}
.toggle button{position:relative;z-index:1;border:0;background:transparent;font:inherit;font-size:13px;font-weight:600;color:var(--suave);padding:8px 16px;border-radius:999px;cursor:pointer;transition:color .3s}
.toggle button[aria-pressed="true"]{color:#fff}
.toggle .pill{position:absolute;top:4px;bottom:4px;left:4px;border-radius:999px;background:var(--verde);transition:all .35s cubic-bezier(.4,1.3,.5,1)}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.card{background:#fff;border:1.5px solid var(--linha);border-radius:16px;padding:18px 14px;text-align:center;transition:transform .25s,box-shadow .25s}
.card:hover{transform:translateY(-4px);box-shadow:0 10px 24px rgba(55,111,71,.12)}
.card.dest{border:2px solid var(--verde)}
.nivel{font-size:11px;letter-spacing:.14em;font-weight:700;color:var(--suave)}
.card h3{margin:4px 0 2px;font-size:18px;color:var(--verde)}
.marca{font-size:12.5px;min-height:18px;transition:opacity .25s}
.preco{margin-top:10px;font-size:clamp(26px,4.4vw,32px);font-weight:800;color:var(--verde);font-variant-numeric:tabular-nums}
.por{font-size:12px;color:var(--suave)}
.det{margin-top:8px;padding-top:8px;border-top:1px solid var(--linha);font-size:11.5px;color:var(--suave)}
.nota{margin:10px 0 0;font-size:12.5px;color:var(--suave);text-align:center}
.como{margin-top:24px;padding:16px 18px;border-radius:12px;background:var(--creme);font-size:13px}
.como p{margin:0 0 6px}.como b{color:var(--verde)}
footer{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:26px;padding-top:14px;border-top:1px solid var(--linha);font-size:12px}
footer em{color:var(--verde);max-width:380px}footer address{font-style:normal;color:var(--suave);text-align:right}
.rev{opacity:0;transform:translateY(18px);transition:opacity .6s ease,transform .6s ease}
.rev.on{opacity:1;transform:none}
@keyframes barra{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes brilho{to{transform:translateX(100%)}}
@media (max-width:640px){.req,.cards{grid-template-columns:1fr}.passos{flex-direction:column;gap:8px}.passo{margin:0}.tipo{text-align:left}footer address{text-align:left}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.rev{opacity:1;transform:none}}

.para{margin:0 0 10px;font-size:14px;color:var(--suave)}.para b{color:var(--texto)}
.nav{position:sticky;top:0;z-index:5;display:flex;gap:6px;overflow-x:auto;padding:8px 0;margin:0 0 6px;background:var(--fundo);scrollbar-width:none}
.nav a{flex:0 0 auto;padding:6px 12px;border-radius:999px;background:var(--creme);color:var(--verde);font-size:12.5px;font-weight:600;text-decoration:none}
.serv{padding-top:18px;margin-top:22px;border-top:1px solid var(--linha);scroll-margin-top:52px}
.serv>h2{margin:0 0 4px;font-size:clamp(18px,3.2vw,22px);color:var(--texto)}
.cards.duas{grid-template-columns:repeat(2,1fr)}.cards.um{grid-template-columns:minmax(0,320px);justify-content:center}
.passos{margin:12px 0 14px}
.importante{margin-top:14px;padding:14px 18px;border-left:4px solid var(--verde);background:var(--creme);border-radius:0;font-size:13px}
.importante b{color:var(--verde)}.importante ul{margin:6px 0 0 18px;padding:0}.importante li{margin:3px 0}
.lista{border:1.5px solid var(--linha);border-radius:14px;overflow:hidden}
.lista div{display:flex;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--linha);font-size:14px}
.lista div:last-child{border-bottom:0}.lista b{color:var(--verde);white-space:nowrap}
#tranca{padding:40px 0;text-align:center}
@media (max-width:640px){.cards.duas{grid-template-columns:1fr}}

<script>
const TRANCADA=1;
const brl=v=>"R$ "+v.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
const reduz=matchMedia("(prefers-reduced-motion: reduce)").matches;
function conta(el,ate,de){if(reduz){el.textContent=brl(ate);return}const t0=performance.now(),dur=900;de=de??0;
 function f(t){const q=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-q,3);el.textContent=brl(de+(ate-de)*e);if(q<1)requestAnimationFrame(f);else el.textContent=brl(ate)}requestAnimationFrame(f)}
function iniciar(){
 const valor=p=>p.dataset.simples?+p.dataset[(p.closest(".cards").dataset.dente)||"simples"]:+p.textContent.replace(/[^0-9,]/g,"").replace(",",".");
 document.querySelectorAll(".preco").forEach(p=>{p.dataset.final=valor(p)});
 const io=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;const el=e.target;el.classList.add("on");io.unobserve(el);
  el.querySelectorAll&&el.querySelectorAll(".preco").forEach(p=>conta(p,+p.dataset.final))}),{threshold:.12});
 document.querySelectorAll(".rev").forEach((el,i)=>{el.style.transitionDelay=(i%6*60)+"ms";io.observe(el)});
 document.querySelectorAll(".toggle").forEach(tg=>{const pill=tg.querySelector(".pill"),bts=[...tg.querySelectorAll("button")],grupo=document.querySelector('.cards[data-grupo="'+tg.dataset.alvo+'"]');
  const poe=b=>{pill.style.left=b.offsetLeft+"px";pill.style.width=b.offsetWidth+"px"};
  setTimeout(()=>poe(bts[0]),300);addEventListener("resize",()=>poe(bts.find(b=>b.getAttribute("aria-pressed")==="true")));
  bts.forEach(b=>b.onclick=()=>{const antes=grupo.dataset.dente||"simples";if(b.dataset.d===antes)return;grupo.dataset.dente=b.dataset.d;
   bts.forEach(x=>x.setAttribute("aria-pressed",x===b));poe(b);
   grupo.querySelectorAll(".m-s").forEach(m=>{m.style.opacity=0;setTimeout(()=>{m.textContent=b.dataset.d==="trilux"?"Dentes Trilux":"Dentes Biolux ou New Ace";m.style.opacity=1},200)});
   grupo.querySelectorAll(".preco").forEach(p=>conta(p,+p.dataset[b.dataset.d],+p.dataset[antes]))})});
}
async function abrir(){
 const box=document.getElementById("tranca");
 try{const d=JSON.parse(document.getElementById("dados").textContent);const k=location.hash.slice(1);
  if(!k)throw 0;const b=s=>Uint8Array.from(atob(s.replace(/-/g,"+").replace(/_/g,"/")+"===".slice((s.length+3)%4)),c=>c.charCodeAt(0));
  const chave=await crypto.subtle.importKey("raw",b(k),"AES-GCM",false,["decrypt"]);
  const txt=new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b(d.iv)},chave,b(d.ct)));
  document.getElementById("conteudo").innerHTML=txt;iniciar();
 }catch(e){box.innerHTML='<p class="intro">Esta tabela é exclusiva. Para acessar, use o link completo enviado pelo laboratório.</p>'}}
TRANCADA?abrir():iniciar();
</script></body></html>
